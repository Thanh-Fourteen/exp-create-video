# Ngưỡng chất lượng — VIẾT TRƯỚC khi render video đầu tiên.
#
# Ngày viết: 2026-08-04. Chưa có video nào để chấm.
# Sửa ngưỡng sau khi nhìn thấy kết quả = không còn là ngưỡng.
# Muốn sửa: ghi lý do + ngày vào research/, đừng sửa lặng lẽ.

# ─────────────────────────────────────────────────────────────
# T1 — cổng kỹ thuật. Chạy bằng ffprobe + OpenCV, KHÔNG LLM.
# Đây là tầng DUY NHẤT được chặn cứng bằng số. Fail là không ra.
# ─────────────────────────────────────────────────────────────
t1_technical:
  duration_sec:
    min: 15          # ngắn hơn thì chưa kịp truyền đạt gì
    max: 60          # dài hơn thì tụt retention trên TikTok
  resolution:
    width: 1080
    height: 1920     # đúng tuyệt đối, không chấp nhận sai lệch

  audio:
    max_peak_dbfs: -1.0        # cao hơn = clip, nghe rè
    min_rms_dbfs: -30.0        # thấp hơn = quá nhỏ, người xem không nghe rõ
    max_silence_sec: 2.0       # im quá 2s giữa video = người xem lướt
    # Thêm 2026-10-01 (P3b) — KIỂM MỚI, không sửa ngưỡng cũ. Viết trước khi chạy,
    # lý do ở research/08-nang-cap-chat-luong.md §6. demo-02 đo -20,0 LUFS và lọt
    # qua vì cổng cũ chỉ đo mean_volume. Đích -14 là đồng thuận blog (reported) —
    # TikTok không công bố spec loudness.
    loudness:
      integrated_lufs: [-15.5, -12.5]
      max_true_peak_dbtp: -1.0
    # Thêm 2026-10-02 — KIỂM MỚI, viết TRƯỚC khi chạy trên video thật. demo-03 có nhạc nền nhưng
    # ducking dìm nhạc xuống dưới giọng 27 dB → nghe như không có nhạc mà không kiểm nào bắt.
    # Đọc audio/mix.json do sound/design.py ghi (bỏ qua nếu video không có mix). 12–18 dB là khoảng
    # thường dùng cho lời nói trên nhạc nền (reported, research/probes/cuon-hon-2026-10-02.md).
    music_under_voice_db: [-20, -10]

  video:
    max_black_frame_sec: 0.5   # frame đen dài hơn = lỗi render
    # Thêm 2026-10-01 (P3b.S1), cùng lý do như loudness ở trên — research/08 §6.
    # demo-02: dải nền ~24px mép phải đầu mỗi shot (Ken Burns pan > scale), và
    # whip-pan trượt trên nền đen ~60% khung. blackdetect toàn khung không bắt được.
    max_border_px: 4           # dải tối phẳng sát mép, ngoài frame transition cố ý
    max_static_sec: 2.0        # đứng hình hoàn toàn — mọi shot phải có chuyển động
    min_fps: 24
    max_fps: 60

  captions:
    # Lệch giữa timestamp trong spec và audio thật.
    # 120ms là ngưỡng người bắt đầu cảm nhận được phụ đề "trễ".
    max_drift_ms: 120
    require_word_level: true

  # Vùng an toàn TikTok — UI (like/share/caption/username) che các mép này.
  # Chữ tràn vào đây thì trên máy nhìn ổn, trên app bị che.
  # Số tính theo % của 1080×1920.
  safe_area_pct:
    top: 8       # thanh trạng thái + nút quay lại
    bottom: 20   # caption + nhạc + thanh tiến trình
    left: 4
    right: 18    # cột nút like / comment / share

# ─────────────────────────────────────────────────────────────
# T1 phụ — proxy GIỮ CHÂN bằng code. CHỈ CẢNH BÁO, KHÔNG CHẶN.
# Thêm 2026-10-02 (Phase V5) — KIỂM MỚI, viết TRƯỚC khi có video đăng nào, không sửa ngưỡng cũ.
# Cơ sở: research/11-audit-tiktok-ai.md §3.1 + §8.4 (rời bỏ dồn ở 5s đầu — AAAI 2025; chữ > hình > lời
# — Kallaway, OBS; ads: thông điệp trong 3s — DATA quảng cáo). Đây là HYP: chỉ được thành chặn sau khi
# 20 video cho thấy tương quan với retention 5s / approve_rate. Sửa → ghi lý do + ngày vào research/.
t1_retention_warn:
  hook_text_max_words: 7     # chữ tiêu đề frame 0
  first_info_max_sec: 3.0    # từ mang thông tin (số/tên riêng/từ nhấn) đầu tiên của hook
  ai_image_max_share: 0.5    # thời lượng ảnh AI / tổng
  max_idea_sec: 12           # một shot (một ý hình) dài nhất

# ─────────────────────────────────────────────────────────────
# T2 — chất lượng hình ảnh (VLM). ĐỀ XUẤT render lại, không chặn.
# Ngưỡng đặt CAO có chủ ý: VLM hay "chê lấy lệ", ngưỡng thấp thì
# mọi video đều tốn 2 vòng sửa vô ích.
# ─────────────────────────────────────────────────────────────
t2_visual:
  min_shot_score: 6           # thang 0–10
  max_failing_shots_pct: 25   # quá 1/4 số shot hỏng thì render lại cả loạt
  block_on:
    - anatomy_error           # tay 6 ngón, mặt méo — người xem nhận ra ngay
    - garbled_text_in_image   # chữ trong ảnh bị bóp thành ký tự vô nghĩa
    # Thêm 2026-08-21 (P4.S1) khi viết qc/t2_vlm.py — chưa có trong bản gốc vì
    # tầng T2 lúc đó chưa tồn tại. Đây là hoàn thiện taxonomy để dựng feature,
    # KHÔNG phải chỉnh ngưỡng sau khi thấy kết quả: ảnh lạc chủ đề là lỗi rõ
    # ràng như lỗi giải phẫu, không phải gu thẩm mỹ. Xem research/probes/p4-s1.md (file
    # p4s1-vlm.md mà dòng này từng trỏ tới chưa bao giờ tồn tại — sửa chú thích 2026-10-02)
    - topic_mismatch
  warn_only:
    - style_inconsistent
    - low_contrast
    # Thêm 2026-08-21 (P4.S1), cùng lý do trên. Chuyển cảnh giật là vấn đề NHỊP
    # DỰNG (đáng lẽ thuộc T3), nhưng VLM đang cầm sẵn hai ảnh cạnh nhau nên tiện
    # ghi vết ở đây — không chặn, vì đây không phải lỗi ảnh mà là lựa chọn dựng.
    - harsh_cut

# ─────────────────────────────────────────────────────────────
# T3 — sức hút. ĐỀ XUẤT sửa script, không chặn.
# Tầng chủ quan nhất → rubric ở configs/rubric.md, không để LLM tự nghĩ tiêu chí.
# ─────────────────────────────────────────────────────────────
t3_appeal:
  min_total_score: 7          # thang 0–10
  min_hook_score: 8           # hook chấm khắt hơn: 3 giây đầu quyết định tất cả
  weights:
    hook: 0.40                # nặng nhất — người xem quyết định ở lại hay lướt
    pacing: 0.25
    vietnamese_quality: 0.25  # câu dịch máy nghe ra ngay, giết uy tín
    cta: 0.10

# ─────────────────────────────────────────────────────────────
# T4 — độ chính xác sự thật. CHẶN CỨNG.
# Nội dung AI rất dễ sai tên model / con số / ngày. Sai trên TikTok bị bóc nhanh.
# ─────────────────────────────────────────────────────────────
t4_facts:
  max_contradictions: 0       # mâu thuẫn trực tiếp với nguồn gốc = chặn
  max_unverified_claims: 3    # chưa kiểm được thì gắn cờ cho Tony, KHÔNG chặn
  require_source_for:
    - model_name
    - benchmark_number
    - release_date
    - org_name

# ─────────────────────────────────────────────────────────────
# Vòng lặp QC
# ─────────────────────────────────────────────────────────────
qc_loop:
  # Trần CỨNG. Vòng 1 bắt lỗi hiển nhiên, vòng 2 bắt lỗi tinh,
  # vòng 3 hiếm khi đáng tiền. Thiếu trần = đốt token không kiểm soát.
  # Đây phải là hằng số trong code, không chỉ nằm ở config.
  max_rounds: 2
  # Hết vòng mà chưa đạt thì VẪN gửi Tony kèm danh sách lỗi còn lại.
  # Critic đề xuất, không quyết định.
  send_on_exhausted: true

# ─────────────────────────────────────────────────────────────
# Ngưỡng vận hành — xem research/00-problem.md mục "đủ tốt"
# ─────────────────────────────────────────────────────────────
operational:
  max_wall_time_min: 40       # từ lúc chốt chủ đề đến khi có mp4
  max_vram_gb: 6.0            # ràng buộc cứng của RTX 2060
  target_approve_rate: 0.5    # metric chính, đo trên 20 video đầu
  target_t1_pass_rate: 0.9
  max_avg_qc_rounds: 1.5
  # Điều kiện dừng dự án: approve_rate < 0.3 sau 20 video
  # → vấn đề ở nội dung, không ở pipeline. Xem lại rubric, ĐỪNG thêm agent.
  abort_approve_rate: 0.3
