# Máy chạy. Mặc định: HẾT trên tony.
#
# Vì sao không dùng tris: đo 2026-08-04 thấy 2× RTX 5090 nhưng cả hai đang bận
# ~29GB/32GB → chỉ mượn được khe < 2GB, ít hơn 6GB trống của tony. Con 5090
# không giúp được khâu nút thắt. Một máy thì không SSH, không đồng bộ file,
# không lệch môi trường.

default: tony

machines:
  tony:
    enabled: true
    host: localhost
    gpu: "RTX 2060"
    vram_gb: 6            # RÀNG BUỘC CỨNG của cả dự án
    cores: 12
    ram_gb: 31
    repo: /mnt/data1tb/exp-create-video

  tris:
    enabled: false        # bật khi P1.S3 cho thấy render trên tony quá chậm
    host: tris            # ssh alias
    gpu: "2x RTX 5090"
    vram_gb: 2            # khe mượn được, KHÔNG phải 32 — hai card đang bận
    cores: 32
    ram_gb: 123
    note: >
      Chỉ dùng cho Remotion render (CPU-bound, 0 VRAM). Đừng đẩy job sinh ảnh
      sang đây — khe 2GB nhỏ hơn 6GB trống của tony.

# Ràng buộc phát sinh từ 6GB: khối visual (~5-6GB) và VLM chấm ảnh (~4GB)
# KHÔNG được nạp cùng lúc. Hàng đợi phải tuần tự hoá job chiếm GPU và
# gọi torch.cuda.empty_cache() trước khi sang bước sau.
# Quên -> OOM ngẫu nhiên giữa chừng render, rất khó truy.
gpu_exclusive_stages:
  - visual
  - qc_t2_vlm
  - tts
