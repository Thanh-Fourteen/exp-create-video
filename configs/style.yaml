# Phong cách video. Remotion đọc file này qua video-spec.json.

format:
  width: 1080
  height: 1920
  fps: 30
  target_duration_sec: 45      # trong khoảng 15-60 của thresholds.yaml
  # 2026-08-14 sáng: hạ 45 -> 35 cho nhịp nhanh hơn.
  # 2026-08-14 chiều: TRẢ VỀ 45. Tony nghe demo-02: "không tự nhiên như người
  # nói, để tốc độ cũ có vẻ tốt hơn". Xem research/06-nhip-va-font.md.

# Vùng an toàn TikTok — UI che các mép này. Số ở thresholds.yaml (safe_area_pct).
# Chữ tràn vào đây: trên máy nhìn ổn, trên app bị che.

typography:
  caption:
    # 2026-08-14: Be Vietnam Pro -> Anton (Tony: "font hơi xấu").
    # Anton là condensed: cùng cỡ chữ thì chứa nhiều ký tự hơn trên một dòng,
    # nên vừa to hơn vừa ÍT xuống dòng hơn — mà xuống dòng mới là thứ đẩy chữ
    # vào vùng UI TikTok che (xem eval/results/2026-08-14-baseline.md).
    # Chỉ có một weight (400), và nó vốn đã rất nặng nên không cần 800.
    font: "Anton"                # font Việt, có đủ dấu — KHÔNG dùng Inter/Roboto
    weight: 400
    size_px: 84
    stroke_px: 8                 # viền đen để đọc được trên mọi nền (Anton nặng hơn -> viền dày hơn)
    color: "#FFFFFF"
    highlight_color: "#FFE14D"   # màu từ đang đọc (karaoke)
    position: center-lower       # trên vùng UI TikTok, dưới tâm màn hình
  hook:
    size_px: 112                 # to hơn hẳn — 3 giây đầu phải đập vào mắt
    weight: 400

motion:
  # Chuyển động là thứ tạo "sinh động" ở đây, vì trần chất lượng ảnh do 2060
  # đặt ra rất thấp. Đầu tư ở đây, không ở khối sinh ảnh.
  ken_burns:
    # 2026-08-14 sáng: 1.15 -> 1.22, 3-6s -> 2-4s cho nhịp nhanh.
    # 2026-08-14 chiều: trả về khi hoàn nhịp cũ. Biên độ zoom đi kèm độ dài
    # shot — shot dài mà zoom mạnh thì thành chóng mặt, đúng cảnh báo ban đầu.
    zoom_range: [1.0, 1.15]
    duration_sec: [3, 6]
  transition:
    default: cut                 # cut hợp nhịp TikTok hơn fade
    accent: whip-pan
    duration_frames: 6
    accent_every: 3              # cứ 3 shot thì 1 whip-pan
  # P3b.S10 (2026-10-01): ảnh SDXL + depth map (Depth Anything V2-Small, Apache)
  # → camera trôi trong cảnh thay vì zoom phẳng. Tony: "ảnh chưa sinh động".
  parallax: true
  # 2026-08-14 chiều: trả về 3-8s sau khi Tony nghe demo-02 (nhịp 2-4s).
  # 2026-10-02: 3-8 → 2.5-5. Tony: "video chưa hấp dẫn". Lý do bác nhịp nhanh hồi 08-14 là
  # GIỌNG đứt quãng (câu ngắn = nhiều mối ghép TTS) — đổi nhịp HÌNH không đụng tới câu/TTS.
  # Research: tần suất cắt cảnh là top-3 yếu tố nhưng chữ U ngược (Xue et al. 2026-04) → vừa phải.
  shot_duration_sec: [2.5, 5]

captions:
  # P3b.S5 (2026-10-01): phụ đề theo CỤM thay cả câu. Lý do từng số:
  # research/probes/p3b-s5-research.md. `mode: sentence` để quay về cả câu.
  mode: chunk
  max_tokens: 3        # âm tiết mỗi cụm (tiếng Việt: 1 "từ" trong words = 1 âm tiết)
  max_chars: 14        # vừa MỘT dòng Anton ở chunk_size_px trong hộp an toàn 842px
  min_sec: 0.3         # bẫy của step: cụm ngắn đổi nhanh vượt 10 từ/s
  gap_sec: 0.25        # lặng dài hơn → luôn cắt cụm
  max_emph_tokens: 6   # không xé cụm nhấn ("sáu trăm hai mươi bốn MiB") — thu chữ thay vì cắt
  chunk_size_px: 116   # to hơn caption cả câu (84) vì mỗi lúc chỉ 1-3 từ

audio:
  # Sound design (P3b.S6, 2026-10-02) — sound/design.py: nhạc + SFX tự tổng hợp, ducking theo giọng.
  sound_design: true
  music: true
  # 2026-10-02: ace = ACE-Step 1.5 (MIT) chạy CPU ~85s/bài (p3b-s6-nhac.md) · synth = nhạc tổng hợp numpy.
  # ACE lỗi thì tự lùi về synth.
  music_source: ace
  sfx: true
  voice_gain_db: 0
  music_gain_db: -18             # nhạc nền phải chìm hẳn dưới giọng đọc
  ducking: true
  # Nhạc nền CHƯA CHỐT — xem "Nợ kỹ thuật" ở todos.md.
  # Hai phương án: nhạc CC0 (tự động được) hay Tony thêm nhạc trending trong app
  # (hợp thuật toán TikTok hơn nhưng phá luồng tự động).
  music_dir: data/music

palette:
  # Tránh "AI slop" mặc định: gradient tím trên nền trắng/đen, font hệ thống.
  bg: "#0D0D0F"
  fg: "#FFFFFF"
  accent: "#4DE1C1"
  warn: "#FF6B4D"
