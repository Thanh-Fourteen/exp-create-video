# Kênh 1 — AI (tách ra 2026-10-04, research/13 §5). Khoá nào không khai thì code dùng mặc định cũ —
# kênh này cố ý gần như rỗng để hành vi KHÔNG đổi so với trước khi tách.
name: "Xưởng AI"
short: "AI"
order: 1
handle: "aidehieu.vn"      # TikTok ID (Buffer, 2026-10-08)
buffer_channel_id: "6ac766106a5c39ccb64ed6db"   # đăng 1 nút qua Buffer — research/22
tiktok_sec_uid: "MS4wLjABAAAAs2ejhYnQjFVlQUEeFPo_FR7zTr_2F1RCY_3cVbcfV8pHcRzkzF_WDLPiEahzfsq8"   # ID kênh cho yt-dlp (tiktokuser:…) — tự theo dõi số, research/23
accent: "#7FA6FF"            # sapphire — màu nhấn web hiện tại (research/12 §8)
audience: "người Việt phổ thông quan tâm AI: sinh viên, dân văn phòng, người làm nội dung"
rubric: configs/rubric.md
pillars:                     # trước đây định nghĩa 3 lần (researcher, scriptwriter, web/library)
  tin_nong: {vi: "Tin nóng", desc: "tin AI mới — điều gì vừa xảy ra và nó đổi gì cho người Việt"}
  cong_cu:  {vi: "Công cụ",  desc: "công cụ AI dùng được NGAY (miễn phí hoặc rẻ) — làm được gì, bắt đầu thế nào"}
  meo:      {vi: "Mẹo",      desc: "mẹo/prompt dùng AI hằng ngày (học, làm, văn phòng) — người xem làm theo được"}
  so_sanh:  {vi: "So sánh",  desc: "so sánh hai lựa chọn (model, tool, gói giá) — chọn cái nào"}
  tu_do:    {vi: "Tự đo",    desc: "tự chạy/tự đo trên máy thật (RTX 2060 6GB) — số đo của chính kênh"}
  canh_bao: {vi: "Cảnh báo", desc: "bóc tin đồn, cảnh báo lừa đảo/rủi ro khi dùng AI"}
  # 2026-10-12 (Tony, research/30): trục chính của kênh — repo AI hot trong tuần, kể cho người phổ thông.
  repo_hay: {vi: "Repo hay",  desc: "một repo/app mã nguồn mở (mới hot HOẶC đã có tiếng — 2026-10-19) — làm được việc gì quen, dùng thử thế nào (bản web/app/file cài), thay được app trả phí nào"}
  kien_thuc_repo: {vi: "Kiến thức repo", desc: "kiến thức AI mới rút từ repo hot tuần này — repo X làm được nhờ ý tưởng gì, giải thích dễ hiểu cho người không code"}
shot_kinds: [image, stock, stat, chart, code, screenshot, list, demo]   # demo 2026-10-21 (research/35 §3.2)   # stock 2026-10-05 (research/16) · list 2026-10-11 (research/28: thẻ tóm tắt để lưu)
rules:
  # 2026-10-05 (Tony: "cần tỷ lệ hình ảnh thật, video thật nhiều hơn"): ≥ 25% shot là `stock` (người dùng điện thoại/
  # laptop, văn phòng, phố…) — kênh AI còn cần screenshot/stat làm bằng chứng (research/19).
  real_min_ratio: 0.25
  keep_english_terms: true   # model, fine-tune, inference… giữ nguyên (T3 V_TERMS)
  # 2026-10-19 (exp/khao-sat/2026-10-19-ai, research/34): câu ngoặt thật thà hay nằm sát câu kết (73–80%) → nới 40–75% thành 40–90%.
  twist: [0.40, 0.90]
  # 2026-10-21 (research/35 §3.4): lưu/view cộng dồn 0,27% vs xu hướng 1,71%. Thẻ list cuối đang hiện 1,8–2,9s (câu kết ngắn)
  # → câu kết ≥ 10 từ (~2,6s) khi shot cuối là thẻ list, để kịp chụp màn hình.
  final_card_min_words: 10
  # 2026-10-21 (research/35 §3.1): đọc 3,8 từ/s vs 4,5–5,3 ở 8/11 kênh xu hướng → tốc độ ×1,12/×1,20 CHỈ bật sau nghe mù /nghe-thu
  voice_tempo_test: true
  # 2026-11-17 (W5, AUDIT #5): demo thật chiếm ~6% thời lượng video AI (ngưỡng ≥ 20%). Video thuộc các pillar này mà đề bài có
  # link repo/trang công khai → kịch bản cần ≥ 2 shot `demo` (code kiểm, loại MỀM; demo cùng url lần 2 chạy tiếp, không lặp).
  demo_pillars: [repo_hay, cong_cu, kien_thuc_repo]
  demo_min_shots: 2
trend:
  # 2026-10-10 (research/26): gợi ý ở trang Tạo video lấy từ KHO Ý TƯỞNG (idea_gen mỗi sáng) thay vì trend model mới
  # (HF/arXiv) — Tony: "ý tưởng quá dở"; trend model gần như không bùng nổ ở kênh AI Việt. trend_scout vẫn chạy nền.
  scout: idea_scout
  # 2026-10-12 (Tony: "kênh AI sửa thành gợi các repo hay, các kiến thức repo AI mới, hot trong tuần" — research/30):
  # idea_gen nhận danh sách repo AI hot tuần do CODE lấy (team/repo_feed.py) + được WebFetch README để kiểm.
  repo_feed: true
  # 2026-10-12 (Tony: "Tôi cần là ý tưởng về tin tức AI mới trong ngày, trong tuần" — research/30 §5): tin AI 7 ngày từ RSS
  # (genk, Dân trí, The Verge, TechCrunch, OpenAI, Anthropic, DeepMind) + Hacker News — team/news_feed.py.
  news_feed: true

# R3 (2026-10-04): DẠNG VIDEO — rút từ khảo sát 12 kênh AI Việt, 360 video (research/15-khao-sat-tiktok.md §2). Video
# bùng nổ (×20–113 trung vị kênh) đều thuộc các dạng dưới. agents/angles.py chọn 1 dạng/video, phạt dạng vừa dùng.
formats:
  meo_it_nguoi_biet:
    label: "Mẹo ít người biết"
    desc: "mẹo/tính năng dùng được NGAY mà ít người biết (lệnh, cài đặt, công cụ miễn phí) — @hieuanca 1,2M view ×113"
    structure: "hook = lợi ích cụ thể + 'ít người biết' · từng mẹo: làm gì → kết quả thấy được (ảnh chụp/thẻ list) · CTA lưu lại"
  dung_nua:
    label: "Đừng làm thế nữa"
    desc: "'Đừng … nữa, dùng cái này' — chỉ ra cách đang làm tốn công và cách thay thế — @hungnpv 645K ×17,9; @ainius.net 90K ×21"
    structure: "hook = 'Đừng X nữa' · vì sao X tệ (1 câu, có số) · Y làm khác gì (bằng chứng) · khi nào vẫn nên X (thật thà) · CTA"
  he_qua_nguoi_viet:
    label: "Tin nóng"
    desc: "tin AI/công nghệ kể bằng HỆ QUẢ cho người Việt (tiền, việc làm, mạng, học hành) — @aidev.news 247K ×93"
    structure: "hook = điều vừa xảy ra + ảnh hưởng tới 'bạn' · chuyện gì (2–3 sự thật) · nhưng… (chỗ ngoặt) · bạn nên làm gì"
  so_sanh_tien:
    label: "So sánh"
    desc: "so sánh tiền/thời gian: AI vs cách cũ, gói này vs gói kia — @ai5phut 'thuê trợ lý 8–10 triệu' 266K ×48"
    structure: "hook = con số tiền/thời gian gây sốc · bên A · bên B (thẻ chart) · nhưng… · kết luận chọn gì cho ai"
  vi_sao:
    label: "Vì sao?"
    desc: "câu hỏi 'Vì sao …?' về một chuyện AI khó hiểu, trả lời dễ hiểu — @ainius.net 'Vì sao model mới vừa khôn vừa rẻ' ×5"
    structure: "hook = câu hỏi người xem đang thắc mắc · trả lời sai thường gặp · câu trả lời thật (từng bước, có hình) · ý nghĩa với bạn"
  # 2026-10-19 (exp/khao-sat/2026-10-19-ai, research/34): video nhiều mục "gõ X → được Y" lưu 2,14%/view (một chuyện 1,15%);
  # @hieuanca 7 lệnh 40s 1,4M lưu 4,4%; "hồi trước phải… giờ chỉ cần…" ở 8/10 video bùng của @hungnpv.
  lenh_nhanh:
    label: "Lệnh nhanh"
    desc: "4–7 lệnh/thao tác gõ được ngay cho MỘT việc ('Nếu bạn gõ X vào ChatGPT, nó…') — @hieuanca 1,4M lưu 4,4%; @caocuongvuai 1,7M lưu 4,9%"
    structure: "hook = mục 1 luôn ('Nếu bạn gõ X vào <app quen>, nó <kết quả thấy được>') · mục 2…N, mỗi mục ≤ 2 câu 'gõ X → được Y' · thẻ list cuối tóm tất cả · CTA lưu hoặc quà ở bình luận"
  truoc_sau:
    label: "Trước – sau"
    desc: "'Hồi trước bạn phải… giờ chỉ cần…' — cách cũ tốn công rồi cách mới từng bước, có kết quả nhìn thấy — @hungnpv 454K lưu 2,7%"
    structure: "hook = 'Đừng/khỏi X nữa' + cái thay thế · hồi trước: 1–2 câu cách cũ cực thế nào · giờ: bước 1, 2, 3 (ảnh chụp trang thật) · kết quả · nhưng… (giới hạn thật) · CTA"
  dem_nguoc:
    label: "Bảng xếp hạng"
    desc: "đếm ngược top N (tool, repo, model) có ô '?' lộ dần — @ainius.net Top GitHub 76,9K"
    structure: "hook = 'N cái tên…' + điều bất ngờ ở số 1 · đếm ngược từ N về 1, mỗi mục 1 câu làm gì + 1 câu vì sao đáng chú ý · số 1 để cuối"
style:
  # 2026-10-05 (Tony: "thêm nhân vật animation", research/19): nhân vật SVG vẽ bằng code trong Remotion (0 GPU),
  # hiện ở câu hook + câu chốt, miệng theo giọng đọc. Bản Kaggle nhép miệng thật (EchoMimicV3) = probe sau.
  mascot: {kind: robot, name: "Bit"}
  brand: {label: "Xưởng AI", counter: false}   # 2026-10-06 research/21 §3: bộ đếm "01/19" = thêm 1 lớp chữ + báo trước video dài
  layout: news                 # D2 research/15 §4 — thẻ tin kiểu @aidev.news
  # D9 (probes/r5-zimage.md): mô tả ảnh chụp — máy ảnh/ống kính/ánh sáng (BFL prompting guide)
  image_suffix: "realistic photograph, shot on Sony A7 IV, 35mm f/1.8, soft natural light with subtle cool blue accents, shallow depth of field, sharp focus, no text, no people"
  music: "calm minimal lo-fi electronic background for a tech news explainer, soft pads, light beat, warm bass, 90 bpm, instrumental, no vocals"
  music_bpm: 90
duration_default: 55           # 2026-10-06 research/21: trung vị 19 video viral AI 52s, 11/19 ≤ 60s; video mình 66–100s (cũ 75s, D5)

# Kho Ý tưởng (team/idea_gen.py) — 2026-10-08, Tony: "trang ý tưởng xưởng AI chưa có ý tưởng gì hết". Trước đây chỉ kênh
# mẹo có idea_gen; kênh AI chỉ có trend scout (gợi ý ở trang Tạo video). Hai đoạn dưới thay phần riêng của kênh mẹo.
prompts:
  # 2026-10-11 (research/28): thẻ `list` cho kênh AI — các bước làm / lệnh / tóm tắt cuối video để người xem dừng lại chụp, lưu.
  extra_kinds: |-
    - `list`: thẻ các bước / lệnh / mẹo đánh số — {"title": "3 bước tóm biên bản họp", "items": [{"text": "Mở Gemini, tải file ghi âm"},
      {"text": "Gõ: tóm tắt + việc cần làm"}, {"text": "Copy sang Zalo nhóm"}]}. 2–5 mục, mỗi mục ≤ 34 ký tự; `mark` = "num"
      (mặc định) | "ok" | "no". `title` ≤ 32 ký tự. Mỗi mục là điều câu đó (hoặc cả video, ở thẻ cuối) nói.
    - `demo` (2026-10-21, research/35 — 68% video AI bùng có cảnh demo, kênh mình 0): CẢNH THẬT của công cụ — `url` là repo
      github.com/<owner>/<repo> hoặc trang web/app công khai đã có trong đề bài. Code lấy GIF/video demo trong repo, không có
      thì quay cuộn trang thật (ảnh chụp app trong README / trang giới thiệu); hỏng thì thành ảnh chụp trang. Gắn vào câu
      nói tới CÔNG CỤ ĐANG LÀM VIỆC ("mở trang là thấy…", "kéo file vào là…"). Video về một công cụ/repo cần ≥ 2 shot `demo`
      (cùng url được — lần sau chạy tiếp cảnh sau), đặt ở câu kể công cụ làm gì; code gắn nhãn "Demo thật" lên hình.
    THỨ ĐÁNG LƯU (2026-10-21, research/35 — lưu/view kênh 0,27% vs xu hướng 1,71%): video mẹo lệnh/công cụ phải có thứ người xem
    CHÉP LẠI dùng được: câu lệnh NGUYÊN VĂN (đọc ra + để trên thẻ `code`/`list`), đường bấm đúng chữ trên máy, tên trang
    web/app viết đúng. Thẻ `list` cuối tóm đúng những thứ đó; câu kết gắn với thẻ cuối dài ≥ 10 từ (thẻ hiện ≥ 2,5s). KHÔNG nói
    "lưu lại" — để thứ đáng lưu tự nói.
  # 2026-10-10 (research/26 — khảo sát 6 kênh AI Việt, 351 video): bùng nổ = DÙNG AI LÀM VIỆC CỤ THỂ, miễn phí
  # ("Các lệnh ngắn ChatGPT ít người biết" ×87, 1,3M; Google Form/sáng kiến kinh nghiệm/CapCut AI ×20–32; "trang web hay
  # nên biết" ×12–18; tin ảnh hưởng thẳng người Việt ×116). Ra mắt model/benchmark gần như không bùng nổ.
  # 2026-10-12 (Tony: "gợi các repo hay, kiến thức repo AI mới, hot trong tuần" → rồi "ý tưởng về tin tức AI mới trong ngày,
  # trong tuần" — research/30 §1, §5). Khảo sát V 2026-10-12 (@ainius.net, 168 video repo ×1,51 trung vị kênh): tiêu đề "chạy
  # local/offline/trên điện thoại" ×2,40; chữ kỹ thuật (agent, cli, npm, backend) ×0,98 vs ×2,22; "N sao" ×0,57; "Top N GitHub
  # tuần" ×0,93; bảo mật/lộ ×0,79. Tin kể bằng HỆ QUẢ cho người Việt (@aidev.news 247K ×93 — research/15).
  # 2026-10-19 (exp/khao-sat/2026-10-19-ai/KET-QUA.md — 130 transcript + metadata 1.527 video 2026, 12 kênh AI Việt; research/34):
  # tin ra mắt model ×0,87 (yếu nhất) · web/app miễn phí ×1,42 · so sánh/rẻ hơn ×1,38 · lệnh ChatGPT cụ thể 12 bùng/0 thường ·
  # repo ×1,61 nhưng repo bùng với người thường là repo CŨ làm việc quen (LocalSend 82K, Meetily 58K). Tin bùng có 1 trong 3 cửa.
  # 2026-10-19 (research/34): lời thật video AI bùng (ASR đã sửa) — học NHỊP và khuôn, không chép nội dung.
  speech_examples: |-
    - @ai.unbox0026 LocalSend (82K, lưu 1,7%): "Muốn chuyển ảnh từ điện thoại sang máy tính mà phải gửi qua Zalo cho chính
      mình, trong khi hai máy ngồi ngay cạnh nhau? LocalSend là ứng dụng mã nguồn mở miễn phí để gửi tập tin giữa các thiết
      bị ở gần, không cần Internet. … Nhưng hai máy phải cùng một mạng."
    - @hieuanca 7 lệnh (1,4M, lưu 4,4%): "Nếu bạn gõ /360view vào ChatGPT, nó sẽ tạo ra góc nhìn 360 độ cho sản phẩm của bạn.
      Và nếu bạn gõ /xray, nó sẽ tạo ra hình minh hoạ kiểu X-quang, cho thấy những gì bên trong sản phẩm."
    - @hungnpv (454K, lưu 2,7%): "Đừng nói bạn vẫn tự thiết kế với Canva nha, dùng AI này đi. Hồi trước thì bạn tìm một cái
      khung, chọn rồi sửa từng cái, từng cái, rất là bó buộc đúng không. Bây giờ bạn chỉ cần vẽ một khung, điền thông điệp,
      ấn nút này."
    - @cafetek (245K): "Bỗng nhiên SIM của bạn bị khoá không lý do? Mười lăm tháng tư là hạn chót xác thực SIM chính chủ.
      Bạn chỉ mất đúng ba mươi giây để tự kiểm tra. Cách một, trên VNeID: mở ứng dụng, vào mục Ví giấy tờ…"
  idea_search: >-
    Đầu vào ở đầu đề bài, do code thu sẵn: (1) TIN AI 7 NGÀY QUA (RSS báo Việt + quốc tế + blog hãng + Hacker News, có giờ đăng),
    (2) REPO MỚI tạo trong 14 ngày, (3) REPO ĐÃ CÓ TIẾNG (mọi tuổi) — kèm license, trang chủ, README — đủ để chọn, KHÔNG cần
    đọc thêm. Chỉ WebSearch (TỐI ĐA 3 lần) để kiểm một tin định chọn có nguồn chính thống, hoặc tìm lệnh/tính năng
    ChatGPT/Gemini/Zalo AI mới mà danh sách chưa có.
  idea_scope: |-
    2. CHỌN THEO VIỆC NGƯỜI XEM LÀM, KHÔNG THEO ĐỘ MỚI. Mỗi ý tưởng trả lời được: "người Việt bình thường dùng nó để làm việc
       gì HẰNG NGÀY, ngay hôm nay?" (gửi ảnh, viết báo cáo, học bài, chỉnh ảnh, tiết kiệm tiền app, an toàn tài khoản…).
       `why` nêu việc đó + vì sao bây giờ (ngày sự kiện nếu là tin: "10/10: …").
       TIN (`tin_nong`, `canh_bao`, `so_sanh`) — chỉ tin ≤ 3 NGÀY và phải qua MỘT trong ba cửa: (a) hệ quả ở VIỆT NAM
       (cáp biển, SIM, ngân hàng, luật VN, giá ở VN), (b) MIỄN PHÍ / RẺ HƠN kèm con số ("bản miễn phí giờ làm được X", "giá
       bằng 1/6"), (c) "AI làm thay bạn việc X" dùng được ngay. Ra mắt model/benchmark/gọi vốn/nhân sự KHÔNG qua cửa nào → bỏ.
       CÔNG CỤ (`repo_hay`, `kien_thuc_repo`) — app/web/repo MỌI TUỔI, miễn làm được việc quen; repo đã có tiếng (danh sách 3)
       kể như "có app miễn phí làm X" (LocalSend: "gửi ảnh gốc khỏi qua Zalo"), KHÔNG kể như tin. Nỗi khổ/lợi ích trước,
       tên sau ":" ("Gửi ảnh gốc cho cả nhà khỏi qua Zalo: app miễn phí LocalSend").
       MẸO LỆNH (`meo`) — 4–7 lệnh/thao tác cụ thể gõ được ngay trong ChatGPT/Gemini/Zalo/Canva cho MỘT việc ("7 lệnh
       ChatGPT viết báo cáo cuối tháng"). Được là chủ đề lâu năm nếu lệnh CỤ THỂ, có kết quả nhìn thấy; cấm "mẹo ChatGPT"
       chung chung.
    2b. Repo phải: license rõ, có trang chủ hoặc demo trong README, dùng được không cần gõ lệnh (hoặc cài 1 file). KHÔNG đồ
        nghề dev (agent framework, CLI, SDK, MCP, backend, workflow automation), model chỉ có trọng số, hack/pentest/
        uncensored. Tiêu đề không mở bằng "N sao", "Top GitHub", chữ "repo"/"GitHub", tên công cụ lạ.
    2c. CÓ GÌ ĐỂ CHO XEM: ưu tiên ý tưởng mà video cho thấy được KẾT QUẢ (trang web/app thật chụp được, ảnh trước–sau, lệnh +
        câu trả lời) — 68% video AI bùng có demo, lưu 1,8% so với 0,8% không demo (khảo sát 2026-10-19).
    3. `hint` = link nguồn tin (đúng link trong danh sách hoặc nguồn chính thống đã kiểm) / link github.com / trang chủ công cụ.
       Không có link → đừng đề xuất.
  idea_mix: "4. Mỗi 10 ý tưởng: khoảng 3 CÔNG CỤ/REPO (≥ 1 repo đã có tiếng), 2 MẸO LỆNH, 3 TIN qua cửa (a)/(b)/(c), 1 CẢNH BÁO (lừa đảo/an toàn/tin Việt Nam), 1 tự chọn. Không hai ý tưởng cùng một tin/công cụ."
