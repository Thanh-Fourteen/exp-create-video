# Kênh 1 — AI (tách ra 2026-10-04, research/13 §5). Khoá nào không khai thì code dùng mặc định cũ —
# kênh này cố ý gần như rỗng để hành vi KHÔNG đổi so với trước khi tách.
name: "Xưởng AI"
short: "AI"
order: 1
handle: "aidehieu.vn"      # TikTok ID (Buffer, 2026-10-08)
buffer_channel_id: "6ac766106a5c39ccb64ed6db"   # đăng 1 nút qua Buffer — research/22
tiktok_sec_uid: "MS4wLjABAAAAs2ejhYnQjFVlQUEeFPo_FR7zTr_2F1RCY_3cVbcfV8pHcRzkzF_WDLPiEahzfsq8"   # ID kênh cho yt-dlp (tiktokuser:…) — tự theo dõi số, research/23
accent: "#7FA6FF"            # sapphire — màu nhấn web hiện tại (research/12 §8)
audience: "người Việt phổ thông quan tâm AI: sinh viên, dân văn phòng, người làm nội dung"
rubric: configs/rubric.md
pillars:                     # trước đây định nghĩa 3 lần (researcher, scriptwriter, web/library)
  tin_nong: {vi: "Tin nóng", desc: "tin AI mới — điều gì vừa xảy ra và nó đổi gì cho người Việt"}
  cong_cu:  {vi: "Công cụ",  desc: "công cụ AI dùng được NGAY (miễn phí hoặc rẻ) — làm được gì, bắt đầu thế nào"}
  meo:      {vi: "Mẹo",      desc: "mẹo/prompt dùng AI hằng ngày (học, làm, văn phòng) — người xem làm theo được"}
  so_sanh:  {vi: "So sánh",  desc: "so sánh hai lựa chọn (model, tool, gói giá) — chọn cái nào"}
  tu_do:    {vi: "Tự đo",    desc: "tự chạy/tự đo trên máy thật (RTX 2060 6GB) — số đo của chính kênh"}
  canh_bao: {vi: "Cảnh báo", desc: "bóc tin đồn, cảnh báo lừa đảo/rủi ro khi dùng AI"}
shot_kinds: [image, stock, stat, chart, code, screenshot, list]   # stock 2026-10-05 (research/16) · list 2026-10-11 (research/28: thẻ tóm tắt để lưu)
rules:
  # 2026-10-05 (Tony: "cần tỷ lệ hình ảnh thật, video thật nhiều hơn"): ≥ 25% shot là `stock` (người dùng điện thoại/
  # laptop, văn phòng, phố…) — kênh AI còn cần screenshot/stat làm bằng chứng (research/19).
  real_min_ratio: 0.25
  keep_english_terms: true   # model, fine-tune, inference… giữ nguyên (T3 V_TERMS)
trend:
  # 2026-10-10 (research/26): gợi ý ở trang Tạo video lấy từ KHO Ý TƯỞNG (idea_gen mỗi sáng) thay vì trend model mới
  # (HF/arXiv) — Tony: "ý tưởng quá dở"; trend model gần như không bùng nổ ở kênh AI Việt. trend_scout vẫn chạy nền.
  scout: idea_scout

# R3 (2026-10-04): DẠNG VIDEO — rút từ khảo sát 12 kênh AI Việt, 360 video (research/15-khao-sat-tiktok.md §2). Video
# bùng nổ (×20–113 trung vị kênh) đều thuộc các dạng dưới. agents/angles.py chọn 1 dạng/video, phạt dạng vừa dùng.
formats:
  meo_it_nguoi_biet:
    label: "Mẹo ít người biết"
    desc: "mẹo/tính năng dùng được NGAY mà ít người biết (lệnh, cài đặt, công cụ miễn phí) — @hieuanca 1,2M view ×113"
    structure: "hook = lợi ích cụ thể + 'ít người biết' · từng mẹo: làm gì → kết quả thấy được (ảnh chụp/thẻ list) · mẹo hay nhất để CUỐI · CTA lưu lại"
  dung_nua:
    label: "Đừng làm thế nữa"
    desc: "'Đừng … nữa, dùng cái này' — chỉ ra cách đang làm tốn công và cách thay thế — @hungnpv 645K ×17,9; @ainius.net 90K ×21"
    structure: "hook = 'Đừng X nữa' · vì sao X tệ (1 câu, có số) · Y làm khác gì (bằng chứng) · khi nào vẫn nên X (thật thà) · CTA"
  he_qua_nguoi_viet:
    label: "Tin nóng"
    desc: "tin AI/công nghệ kể bằng HỆ QUẢ cho người Việt (tiền, việc làm, mạng, học hành) — @aidev.news 247K ×93"
    structure: "hook = điều vừa xảy ra + ảnh hưởng tới 'bạn' · chuyện gì (2–3 sự thật) · nhưng… (chỗ ngoặt) · bạn nên làm gì"
  so_sanh_tien:
    label: "So sánh"
    desc: "so sánh tiền/thời gian: AI vs cách cũ, gói này vs gói kia — @ai5phut 'thuê trợ lý 8–10 triệu' 266K ×48"
    structure: "hook = con số tiền/thời gian gây sốc · bên A · bên B (thẻ chart) · nhưng… · kết luận chọn gì cho ai"
  vi_sao:
    label: "Vì sao?"
    desc: "câu hỏi 'Vì sao …?' về một chuyện AI khó hiểu, trả lời dễ hiểu — @ainius.net 'Vì sao model mới vừa khôn vừa rẻ' ×5"
    structure: "hook = câu hỏi người xem đang thắc mắc · trả lời sai thường gặp · câu trả lời thật (từng bước, có hình) · ý nghĩa với bạn"
  dem_nguoc:
    label: "Bảng xếp hạng"
    desc: "đếm ngược top N (tool, repo, model) có ô '?' lộ dần — @ainius.net Top GitHub 76,9K"
    structure: "hook = 'N cái tên…' + điều bất ngờ ở số 1 · đếm ngược từ N về 1, mỗi mục 1 câu làm gì + 1 câu vì sao đáng chú ý · số 1 để cuối"
style:
  # 2026-10-05 (Tony: "thêm nhân vật animation", research/19): nhân vật SVG vẽ bằng code trong Remotion (0 GPU),
  # hiện ở câu hook + câu chốt, miệng theo giọng đọc. Bản Kaggle nhép miệng thật (EchoMimicV3) = probe sau.
  mascot: {kind: robot, name: "Bit"}
  brand: {label: "Xưởng AI", counter: false}   # 2026-10-06 research/21 §3: bộ đếm "01/19" = thêm 1 lớp chữ + báo trước video dài
  layout: news                 # D2 research/15 §4 — thẻ tin kiểu @aidev.news
  # D9 (probes/r5-zimage.md): mô tả ảnh chụp — máy ảnh/ống kính/ánh sáng (BFL prompting guide)
  image_suffix: "realistic photograph, shot on Sony A7 IV, 35mm f/1.8, soft natural light with subtle cool blue accents, shallow depth of field, sharp focus, no text, no people"
  music: "calm minimal lo-fi electronic background for a tech news explainer, soft pads, light beat, warm bass, 90 bpm, instrumental, no vocals"
  music_bpm: 90
duration_default: 55           # 2026-10-06 research/21: trung vị 19 video viral AI 52s, 11/19 ≤ 60s; video mình 66–100s (cũ 75s, D5)

# Kho Ý tưởng (team/idea_gen.py) — 2026-10-08, Tony: "trang ý tưởng xưởng AI chưa có ý tưởng gì hết". Trước đây chỉ kênh
# mẹo có idea_gen; kênh AI chỉ có trend scout (gợi ý ở trang Tạo video). Hai đoạn dưới thay phần riêng của kênh mẹo.
prompts:
  # 2026-10-11 (research/28): thẻ `list` cho kênh AI — các bước làm / lệnh / tóm tắt cuối video để người xem dừng lại chụp, lưu.
  extra_kinds: |-
    - `list`: thẻ các bước / lệnh / mẹo đánh số — {"title": "3 bước tóm biên bản họp", "items": [{"text": "Mở Gemini, tải file ghi âm"},
      {"text": "Gõ: tóm tắt + việc cần làm"}, {"text": "Copy sang Zalo nhóm"}]}. 2–5 mục, mỗi mục ≤ 34 ký tự; `mark` = "num"
      (mặc định) | "ok" | "no". `title` ≤ 32 ký tự. Mỗi mục là điều câu đó (hoặc cả video, ở thẻ cuối) nói.
  # 2026-10-10 (research/26 — khảo sát 6 kênh AI Việt, 351 video): bùng nổ = DÙNG AI LÀM VIỆC CỤ THỂ, miễn phí
  # ("Các lệnh ngắn ChatGPT ít người biết" ×87, 1,3M; Google Form/sáng kiến kinh nghiệm/CapCut AI ×20–32; "trang web hay
  # nên biết" ×12–18; tin ảnh hưởng thẳng người Việt ×116). Ra mắt model/benchmark gần như không bùng nổ.
  idea_search: >-
    Dùng WebSearch để tìm cách DÙNG AI LÀM MỘT VIỆC CỤ THỂ mà người Việt phổ thông làm theo được ngay, miễn phí hoặc rẻ:
    lệnh/prompt ChatGPT–Gemini–Copilot hay ít người biết, AI cho dân văn phòng (Excel, email, slide, tóm tắt họp), cho học
    sinh–sinh viên–giáo viên (ôn thi, giáo án, đề trắc nghiệm, sáng kiến kinh nghiệm), cho bán hàng online (ảnh sản phẩm,
    mô tả, video quảng cáo bằng CapCut AI), làm video/ảnh AI đang trend, web/app AI hay nên biết, tính năng mới ra 7–14
    ngày gần đây của ChatGPT/Gemini/Claude/Copilot/Zalo AI dùng được ngay, và tin AI ảnh hưởng thẳng người Việt (lừa
    đảo deepfake, giá gói, chính sách). Nguồn: help center/blog của hãng, docs, trang tính năng chính thức.
  idea_scope: |-
    2. MỞ BẰNG NỖI KHỔ (research/27): `title` dạng "[nỗi khổ quen]? [công cụ]: [lợi ích]" — "Họp xong quên sạch, ghi biên
       bản mất cả tiếng? Meetily: trợ lý họp AI miễn phí". Nỗi khổ của dân văn phòng / học sinh–sinh viên–giáo viên / người bán
       hàng online, KHÔNG mở bằng tên dự án/model.
       MỖI Ý TƯỞNG LÀ MỘT VIỆC LÀM ĐƯỢC SAU KHI XEM: `title` nói rõ làm gì bằng công cụ gì, lợi ích gì ("Dùng ChatGPT
       chấm bài văn theo barem trong 1 phút", "5 lệnh Gemini tóm tắt file PDF dài", "Tạo ảnh sản phẩm nền trắng miễn phí
       bằng AI"). KHÔNG: ra mắt model/benchmark/điểm số, paper, repo cho lập trình viên, tin đồn, chủ đề người phổ thông
       không làm theo được. Tin AI chỉ khi đổi được việc người Việt làm ngay (tính năng mới, giá, lừa đảo).
    2b. (research/28) Ưu tiên dạng DANH SÁCH "N mẹo / N lệnh / N bước / N trang…" (bùng ×1,64) và góc "ít người biết"
        (×1,37); tiêu đề KHÔNG mở bằng tên riêng tiếng Anh (×0,71) — tên công cụ để sau dấu ":".
    3. Phải có NGUỒN chính thống kiểm chứng được (help center, blog, docs của hãng) — ghi domain vào `hint`. Không chắc →
       đừng đề xuất.

