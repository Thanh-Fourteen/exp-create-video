rules:
  # R4 (2026-10-04): demo 1 = 83% thẻ chữ → "trình chiếu". ≥ 40% ảnh cảnh thật (research/14 §0, research/15 §3).
  image_min_ratio: 0.4
  # 2026-10-05 (Tony: "cần tỷ lệ hình ảnh thật, video thật nhiều hơn"): ≥ 40% shot là `stock` (clip/ảnh CHỤP THẬT
  # Pexels/Pixabay) — ảnh AI chỉ khi không quay được ngoài đời (research/19).
  real_min_ratio: 0.4
  keep_english_terms: false   # khán giả phổ thông: nói tiếng Việt, tên app/tính năng giữ nguyên ("Zalo", "Face ID")
  # 2026-10-19 (exp/khao-sat/2026-10-19-meo, 55 video mẹo bùng ≤ 60s; research/34): "Nhưng…" chỉ 6/55 (mình 10/10) → không
  # bắt chỗ ngoặt, thay bằng phản đề "chứ… thì…"; hook không cần "bạn"/số (31/55 không có); không mở vòng tò mò thứ hai.
  twist: false
  hook_who_num: false
  second_loop: false
  # 2026-10-21 (research/35 §3.3): đổi khung toàn/cận mỗi ~1,8s trên ảnh + clip stock (mình 0,26 cắt/s vs 0,7–0,96 ở 7/8 kênh mẹo
  # xu hướng). A/B mục tiêu ~0,6/s trước (Dost & Huang 2026: cắt quá nhanh phản tác dụng).
  montage_sec: 1.5

caption:
  disclaimer_for: [bep_an_toan]
  disclaimer: "Thông tin tham khảo, không thay lời khuyên của bác sĩ/chuyên gia."
  hashtags_base: [songkheo, meovat]

style:
  # 2026-10-05 (Tony: "thêm nhân vật animation", research/19): nhân vật SVG vẽ bằng code trong Remotion (0 GPU),
  # hiện ở câu hook + câu chốt, miệng theo giọng đọc. Bản Kaggle nhép miệng thật (EchoMimicV3) = probe sau.
  mascot: {kind: kheo, name: "bé Khéo"}
  palette: {accent: "#F2B544"}
  brand: {label: "Sống Khéo", counter: false}   # 2026-10-06 research/21 §3: bộ đếm "01/16" = thêm 1 lớp chữ + báo trước video dài
  layout: minimal              # D3 research/15 §4 — nền tối, tiêu đề cố định, ý hiện dần (@tamlyhocthanhcong 425K)
  # D9: mô tả ảnh chụp (BFL guide; probes/r5-zimage.md) — FLUX cùng prompt kiểu này gần như ảnh chụp thật
  image_suffix: "realistic photograph in a Vietnamese home, shot on Fujifilm X-T5, 35mm f/1.8, soft natural window daylight, warm honey tones, shallow depth of field, sharp focus, no text, no people"
  # @tamlyhocthanhcong dùng lo-fi êm ("Cozy Rain Beats"); Tony muốn "nhịp nhẹ nhàng"
  music: "cozy lo-fi hip hop background music, soft rain ambience, mellow electric piano, gentle vinyl crackle, relaxed, 80 bpm, instrumental, no vocals"
  music_bpm: 80
end_styles: [ket_o_dinh, hoi_ab]   # 2026-10-19 research/34: kết ở kết quả/hậu quả mẹo cuối 22/55, mời bình luận 12/55
duration_default: 35           # 2026-10-18 research/33 R2: avg_watch kênh ~6s trên 55s; 12/12 video bùng @meohaymoingay2026 dài 23–32s, 3–4 mẹo (cũ 55 — research/21)

voice: tony

trend:
  scout: idea_scout            # team/idea_scout.py — lịch mùa + kho ý tưởng (không có API trend mẹo cho VN)

prompts:
  # 2026-10-10 (research/26): ý tưởng = MẸO HAY làm ngay. Thay IDEA_SEARCH/SCOPE mặc định trong team/idea_gen.py.
  # 2026-10-12 (Tony: "thân quen trong nhà", research/30 §2) — bỏ lừa đảo/app/pháp luật khỏi nguồn tìm.
  idea_search: >-
    Dùng WebSearch để tìm MẸO TRONG NHÀ người Việt làm được ngay hôm nay với đồ có sẵn: bếp (sơ chế cá/thịt/rau, nấu nhanh
    mà ngon hơn, chọn đồ tươi theo mùa), tủ lạnh & bảo quản (ngăn nào để gì, đồ ăn thừa, gạo, rau), giặt phơi & dọn dẹp
    (vết bẩn, khử mùi, nhà tắm, sắp xếp tủ), đồ điện trong nhà (máy giặt, nồi cơm, ấm siêu tốc, điều hoà, bình nóng lạnh —
    vệ sinh, dùng đúng, tiết kiệm điện), việc nhà theo mùa (tháng 10–11: gió mùa đầu đông + hanh khô miền Bắc, mưa lũ miền
    Trung; 20/10, 11/11, 20/11; dọn nhà đón Tết từ tháng 12 — nồm là tháng 2–4, chưa phải lúc này). Học từ dạng mẹo Việt
    bùng nổ: "Mẹo rán cá, luộc ốc, xào mực" (4,4 triệu view), "Mẹo cắt gọt trái cây siêu tốc" (997K, 28K lưu), "Dọn nhà siêu
    gọn bằng đồ giá rẻ", "Công dụng của nước vo gạo". Nguồn: bachhoaxanh.com, dienmayxanh.com, evnhanoi.vn/evn.com.vn,
    trang hỗ trợ hãng (samsung.com/vn, panasonic.com/vn), vfa.gov.vn, moh.gov.vn.
  idea_scope: |-
    1b. THÂN QUEN TRONG NHÀ (Tony 2026-10-12): mỗi ý tưởng xảy ra TRONG NHÀ — bếp, tủ lạnh, máy giặt, phơi đồ, nhà tắm,
        phòng ngủ, đồ điện, tiền điện nước. Người xem phải gật đầu "nhà mình cũng bị" trong 3 giây đầu. Cụ thể bằng đồ vật
        ai cũng có (nồi cơm, thớt, chăn bông, ấm siêu tốc). KHÔNG: lừa đảo, luật giao thông, thiên tai ngoài đường,
        app/ngân hàng, tin tức (chỉ được nói phần việc trong nhà — vd mất điện thì tủ lạnh giữ lạnh bao lâu). Ưu tiên
        "N mẹo + đồ vật + lợi ích" ("3 chỗ trong máy giặt ít ai lau"), "Công dụng của [đồ sắp bỏ]", việc nhà đúng mùa/miền.
        Không đề xuất pillar có mix 0.
    2. (2026-10-19, exp/khao-sat/2026-10-19-meo/KET-QUA.md — 2.106 tiêu đề + 107 transcript mẹo trong nhà, 22 kênh Việt;
       research/34) VẬT/VIỆC gần như không quyết định bùng (×0,83–1,14) — GÓC KỂ mới quyết định. Mỗi ý tưởng thuộc ĐÚNG MỘT
       góc sau, ghi góc vào đầu `why`:
       • "lạ/bất ngờ" (×1,71): mẹo trái trực giác hoặc sự thật bất ngờ VỀ VIỆC ĐANG LÀM ("Chà gừng lên chảo trước khi rán
         cá", "Cơm nguội hâm lại không hết độc") — được dạng "sự thật", miễn kèm việc làm ngay.
       • "cảnh báo thói quen" (×1,56): thói quen ai cũng làm đang hỏng đồ/phí tiền ("Đổ nước xả vào khay giặt là phí").
       • "N mẹo cùng mảng" (×1,37): 2–4 mẹo KHÁC MÓN cùng một việc ("3 mẹo luộc rau giữ màu xanh").
       • "công dụng đồ có sẵn" (×1,32): đồ sắp bỏ/đồ rẻ làm được việc khác ("Nước vo gạo", "Vỏ cam").
       • "tiền cụ thể" (×1,30): việc trong nhà ra số tiền + nút bấm ("Điều hoà Casper chỉ 4.000đ một đêm: bấm 3 nút").
       QUEN HẰNG NGÀY: vật/việc người xem chạm tới MỖI NGÀY hoặc mỗi tuần (nấu, rửa, giặt, phơi, tủ lạnh, nồi cơm) — việc
       hiếm (vệ sinh bình nóng lạnh, chăn bông cất kho) chỉ khi đúng mùa (khảo sát: việc hằng ngày bùng 68/70, việc hiếm 2/5).
       MÙA quyết định thiết bị: chỉ đề xuất đồ điện ĐANG được dùng trong mùa này (tháng 10–11: quạt sưởi, chăn điện, bình
       nóng lạnh, máy sấy, điều hoà chế độ sưởi; KHÔNG điều hoà làm lạnh) — điều hoà bùng 11/15 ở tháng 6, 1/12 ở tháng 8–10.
       Thiết bị có nhiều hãng: một hãng một ý ("… LG", "… Daikin") — series theo hãng bùng cả 3 bản (2,9M/2,7M/1,0M).
       `title` NÓI LUÔN MẸO hoặc điều bất ngờ. CẤM: chữa bệnh/"thần dược"/thay thuốc, trộn hoá chất tẩy rửa (nhiều mẹo
       viral pha hoá chất — không học), làm đẹp, mẹo nguy hiểm (điện, gas, lửa), mẹo dân gian không có nguồn. Mẹo dính sức
       khoẻ/an toàn thực phẩm chỉ khi cơ quan y tế/ATTP nói.
    2b. KHÔNG LẶP VẬT CHÍNH: mỗi vật chính (chăn bông, gạo, nồi cơm…) tối đa MỘT ý trong lần đề xuất này, và không trùng vật
        chính của danh sách "Đã có" ở trên (kho cũ có chăn bông ×5, gạo mọt ×4). Tiêu đề không mở bằng tên tiếng Anh.
    3. Phải có NGUỒN kiểm chứng (trang hướng dẫn uy tín, hãng, cơ quan) — ghi domain vào `hint`. Không chắc → bỏ.
  research_intro: >-
