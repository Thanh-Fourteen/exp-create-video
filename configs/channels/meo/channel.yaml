  # 2026-10-04 (demo 1): chụp trang umassd.edu tiếng Anh → chữ nhỏ, khán giả phổ thông không đọc được → chỉ trang TIẾNG VIỆT.
  research_visuals: "CHỈ trang TIẾNG VIỆT — trang cảnh báo của cơ quan nhà nước, biểu phí ngân hàng, trang hướng dẫn cài đặt của Apple/Google/Zalo bản tiếng Việt, bảng bảo quản thực phẩm; nguồn tiếng Anh vẫn dùng làm sự thật nhưng KHÔNG đưa vào visuals"
  script_intro: >-
    Bạn viết kịch bản video TikTok tiếng Việt cho kênh "Sống Khéo" — mẹo đời sống cho người Việt PHỔ THÔNG
    (18–45 tuổi, dân văn phòng, sinh viên, người nội trợ). Giọng thân thiện, chắc chắn, như người nhà hiểu
    chuyện mách nhỏ — không giảng đạo, không hù doạ.
    MẸO DÀY (2026-10-19, research/34 — 55 video mẹo bùng ≤ 60s: trung vị 33s, 122 từ, 2 mẹo, mẹo 1 ở giây 3,8): video là
    MỘT MẢNG (D1 = một mảng, vd "luộc rau", không phải một mẹo) gồm 2–4 mẹo KHÁC MÓN, tổng ~110–140 từ. Mỗi mẹo ~30–40
    từ theo KHUÔN 4 NHỊP: [tình huống quen ≤ 8 từ] → [cách làm: động từ + đồ có sẵn + lượng nhỏ "tí/vài lát"] → [kết quả
    giác quan có so sánh: "giòn sần sật", "xanh mướt"] → [phản đề "Chứ <làm sai> thì <hậu quả hài>"]. Không câu giới thiệu,
    "vì sao" tối đa nửa câu ("axit nó làm mềm thớ thịt"). Mẹo bếp/dọn KHÔNG đọc tên nguồn (D4 chỉ cho claim an toàn thực
    phẩm). Video ≤ 40s: KHÔNG câu meta nào. Đề bài chỉ có một mẹo → thêm 1–2 mẹo cùng mảng CÓ trong sự thật đã kiểm.
  # 2026-10-05 (research/19): lời thật kênh top (ASR, đã sửa lỗi nhận dạng) — scriptwriter học NHỊP, không chép nội dung.
  speech_examples: |-
    - @meohaymoingay2026 (2,4M): "Ngồi dòm nồi thịt bò mãi không nhừ à? Ném miếng dứa hoặc thìa giấm vào, axit nó làm mềm
