name: "Sống Khéo"
short: "Mẹo"
order: 2
handle: ""                   # TikTok ID — songkheo.meo đã có người dùng (2026-10-04)
accent: "#F2B544"            # vàng mật ong (avatar out/kenh-meo/avatar/)
audience: "người Việt 18–45, phổ thông: dân văn phòng, sinh viên, người nội trợ, người mới đi làm"
