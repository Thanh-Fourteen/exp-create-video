# R3/D6 (2026-10-04): DẠNG VIDEO rút từ khảo sát 18 kênh mẹo (research/15 §3). angles.py chọn 1/video, luân phiên.
formats:
  su_that:
    label: "Sự thật"          # 2026-10-06: nhãn hiện trên video — dạng này dùng cả cho thực phẩm/điện thoại (research/21)
    desc: "'Sự thật tâm lý học về …' / 'Vì sao …' — 3–5 ý đánh số, mỗi ý một câu — @tamlyhocthanhcong 425K ×27"
    structure: "hook = 'Sự thật về <người/hiện tượng>' · ý 1, 2, 3… (thẻ list hiện dần, mỗi ý 1 câu + 1 câu ví dụ đời thường) · ý bất ngờ nhất để cuối · CTA gửi cho người đó"
  dung_neu_chua_biet:
    label: "Đừng làm vội"
    desc: "'Đừng … nếu chưa biết …' / 'Giáo viên đừng vội …' — chặn một thói quen sai, nói thẳng đối tượng — @tuhocai ×41, @sucsongxanh365 ×28"
    structure: "hook = 'Đừng X nếu chưa biết điều này' · cái giá của X · điều cần biết (1–3 ý) · làm đúng thế nào · CTA lưu lại"
  hoi_dap_luat:
    label: "Hỏi luật"
    desc: "hỏi–đáp pháp luật đời thường: 'Làm X có bị phạt không?' — @truongnamcao 352K"
    structure: "hook = câu hỏi tình huống ai cũng gặp · câu trả lời ngắn (có/không) · căn cứ (văn bản, mức phạt — thẻ stat) · ngoại lệ · bạn nên làm gì"
  tong_hop:
    label: "Mẹo hay mỗi ngày"
    desc: "tổng hợp 4–6 mẹo cùng chủ đề, đánh số, series — 'Mẹo hay mỗi ngày p180' ×455"
    structure: "hook = lợi ích chung + 'mẹo số N là hay nhất' · mẹo 1…N, mỗi mẹo: làm gì → vì sao (thẻ list/ảnh) · mẹo hay nhất để CUỐI · CTA lưu lại"
  ban_dang_sai:
    label: "Bạn đang làm sai"
    desc: "'Đa số đang làm sai …' — chỉnh một thói quen phổ biến bằng nguồn chính thống"
    structure: "hook = 'Đa số người Việt đang X sai' · sai thế nào · vì sao sai (nguồn) · cách đúng (thẻ list ok/no) · CTA"
  canh_bao:
    label: "Cảnh báo"
    desc: "cảnh báo lừa đảo/rủi ro đang xảy ra, kể bằng tình huống (thẻ chat tin nhắn lừa) — 'khiến nhiều gia đình mất hết' 364K"
    structure: "hook = hậu quả có thật + 'đang nhắm vào bạn' · kịch bản lừa (thẻ chat) · dấu hiệu nhận biết · việc làm ngay · CTA gửi cho bố mẹ"

